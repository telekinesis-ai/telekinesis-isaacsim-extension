name: Verify

on:
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff pylint pytest fastapi uvicorn pydantic websockets

      - name: Ruff
        run: ruff check --line-length 100 .

      - name: Pylint
        run: pylint --max-line-length 100 exts/telekinesis.isaacsim.bridge/telekinesis examples

      - name: Pytest (Isaac-Sim-free smoke tests only)
        run: pytest tests/ -v

      - name: Generate OpenAPI schema (sanity check the route/model surface still imports)
        run: python scripts/generate_openapi.py

  version-check:
    # Only meaningful on PRs targeting main: block merging without a version bump,
    # since release.yml tags+releases off whatever version is in extension.toml on main.
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check extension.toml version hasn't already been released
        run: |
          VERSION=$(python3 -c "
          import tomllib
          with open('exts/telekinesis.isaacsim.bridge/config/extension.toml', 'rb') as f:
              print(tomllib.load(f)['package']['version'])
          ")
          echo "PR version: $VERSION"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::v$VERSION is already tagged/released. Bump the version in extension.toml before merging to main."
            exit 1
          fi
