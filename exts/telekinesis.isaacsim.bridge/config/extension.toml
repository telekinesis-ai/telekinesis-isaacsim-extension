[package]
name = "telekinesis.isaacsim.bridge"
version = "0.1.3"
category = "Simulation"
title = "Telekinesis Isaac Sim Bridge"
description = "HTTP and WebSocket bridge for connecting NVIDIA Isaac Sim to local applications with real-time articulation control and streaming."
authors = ["telekinesis.ai"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/telekinesis-ai/telekinesis-isaacsim-extension"
keywords = ["omniverse", "kit", "extension", "telekinesis", "bridge", "simulation"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"   
writeTarget.kit = true

[dependencies]
"isaacsim.core.api" = {}
"isaacsim.gui.components" = {}
"omni.kit.uiapp" = {}

[python.pipapi]
requirements = ["fastapi", "uvicorn", "pydantic", "websockets"]
use_online_index = true

[[python.module]]
name = "telekinesis.isaacsim.bridge"
