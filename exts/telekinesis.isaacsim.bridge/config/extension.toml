[package]
version = "1.1.0"
category = "Simulation"
title = "Telekinesis Isaac Sim Bridge"
description = "HTTP/JSON (FastAPI) bridge between the Synapse interface and Isaac Sim articulations."
authors = ["NVIDIA"]
repository = ""
keywords = []
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true

[dependencies]
"isaacsim.core.api" = {}
"isaacsim.gui.components" = {}
"omni.kit.uiapp" = {}

# FastAPI/uvicorn/pydantic are not in Isaac Sim's bundled Python -- pull them into
# the extension environment. If the deployment forbids online pip, vendor wheels.
[python.pipapi]
requirements = ["fastapi", "uvicorn", "pydantic"]
use_online_index = true

[[python.module]]
name = "telekinesis.isaacsim.bridge"
