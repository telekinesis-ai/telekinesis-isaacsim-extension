[package]
name = "telekinesis.isaacsim.bridge"
version = "v0.1.0-alpha.1"
category = "Simulation"
title = "Telekinesis Isaac Sim Bridge"
description = "HTTP/JSON (FastAPI) and Websocket bridge to enable smooth communication with NVIDIA Isaac Sim."
authors = ["telekinesis.ai"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/telekinesis-ai/telekinesis-isaacsim-extension"
keywords = ["Telekinesis", "Bridge", "Simulation"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true

[dependencies]
"isaacsim.core.api" = {}
"isaacsim.gui.components" = {}
"omni.kit.uiapp" = {}

[python.pipapi]
requirements = ["fastapi", "uvicorn", "pydantic", "websockets"]
use_online_index = true

[[python.module]]
name = "telekinesis.isaacsim.bridge"
